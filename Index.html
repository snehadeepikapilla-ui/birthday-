<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday Surprise ❤️</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #ffe6f0, #fff5f8);
            color: #333;
            overflow-x: hidden;
        }

        /* HOME SCREEN */

        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .heart {
            font-size: 75px;
            animation: beat 1s infinite;
        }

        h1 {
            font-size: 42px;
            color: #ff4f81;
            margin: 15px 0;
        }

        p {
            font-size: 20px;
        }

        button {
            margin-top: 25px;
            padding: 15px 30px;
            border: none;
            border-radius: 30px;
            background: #ff4f81;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.95);
        }


        /* GALLERY */

        #gallery {
            display: none;
            padding: 50px 15px;
            min-height: 100vh;
        }

        #gallery h2 {
            color: #ff4f81;
            font-size: 32px;
        }

        .photos {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 700px;
            margin: 30px auto;
        }

        .photos img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);

            animation: photoAppear 1s ease;
        }


        /* HEART ANIMATION */

        .floating-heart {
            position: fixed;
            bottom: -50px;
            font-size: 25px;
            animation: floatUp 4s linear forwards;
            pointer-events: none;
            z-index: 9999;
        }


        /* CONFETTI */

        .confetti {
            position: fixed;
            top: -20px;
            width: 10px;
            height: 10px;
            animation: fall 4s linear forwards;
            pointer-events: none;
            z-index: 9999;
        }


        /* ANIMATIONS */

        @keyframes beat {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }

        }


        @keyframes floatUp {

            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }

        }


        @keyframes fall {

            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0;
            }

        }


        @keyframes photoAppear {

            from {
                opacity: 0;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }

        }


        /* MOBILE */

        @media (max-width: 500px) {

            h1 {
                font-size: 34px;
            }

            .heart {
                font-size: 65px;
            }

            .photos img {
                height: 240px;
            }

        }

    </style>

</head>


<body>
 <audio>
     <source src="music/birthday.mp3" type="audio/mpeg">
</audio>

    <!-- BACKGROUND MUSIC -->

    <audio id="birthdayMusic" loop>

        <source src="music/birthday.mp3" type="audio/mpeg">

    </audio>



    <!-- FIRST SCREEN -->

    <div class="hero" id="home">

        <div class="heart">
            ❤️
        </div>

        <h1>
            Happy Birthday 🎂
        </h1>

        <p>
            I made something special for you! 💕
        </p>

        <button onclick="showGallery()">
            Open Surprise 🎁
        </button>

    </div>



    <!-- PHOTO GALLERY -->

    <div id="gallery">

        <h2>
            Our Beautiful Memories ❤️
        </h2>

        <p>
            Some moments I'll always remember ✨
        </p>


        <div class="photos">

            <img src="Images/photo1.jpg">
            <img src="Images/photo2.jpg">
            <img src="Images/photo3.jpg">
            <img src="Images/photo4.jpg">

            <img src="Images/photo5.jpg">
            <img src="Images/photo6.jpg">
            <img src="Images/photo7.jpg">
            <img src="Images/photo8.jpg">

            <img src="Images/photo9.jpg">
            <img src="Images/photo10.jpg">
            <img src="Images/photo11.jpg">
            

        </div>

    </div>



    <script>

        function showGallery() {


            /* HIDE HOME */

            document.getElementById("home")
                .style.display = "none";


            /* SHOW GALLERY */

            document.getElementById("gallery")
                .style.display = "block";



            /* FLOATING HEARTS */

            for (let i = 0; i < 25; i++) {

                setTimeout(function() {

                    const heart =
                        document.createElement("div");

                    heart.className =
                        "floating-heart";

                    heart.innerHTML = "❤️";

                    heart.style.left =
                        Math.random() * 100 + "vw";

                    heart.style.fontSize =
                        (20 + Math.random() * 25) + "px";


                    document.body.appendChild(heart);


                    setTimeout(function() {

                        heart.remove();

                    }, 4000);


                }, i * 150);

            }



            /* CONFETTI */

            for (let i = 0; i < 60; i++) {

                const confetti =
                    document.createElement("div");

                confetti.className =
                    "confetti";


                confetti.style.left =
                    Math.random() * 100 + "vw";


                confetti.style.background =
                    ["#ff4f81",
                     "#ffd166",
                     "#06d6a0",
                     "#4dabf7",
                     "#9b5de5"]
                    [Math.floor(Math.random() * 5)];


                confetti.style.animationDelay =
                    Math.random() * 2 + "s";


                document.body.appendChild(confetti);


                setTimeout(function() {

                    confetti.remove();

                }, 6000);

            }

        }

    </script>


</body>

</html>
